name: Linux

on:
  push:
    branches: [main]
    paths:
      - "linux/**"
      - ".github/workflows/linux.yml"
      - "LICENSE"
  pull_request:
    paths:
      - "linux/**"
      - ".github/workflows/linux.yml"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-deb:
    name: Tests and Debian package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi python3-gi-cairo \
            gir1.2-gtk-4.0 gir1.2-adw-1 \
            desktop-file-utils appstream libglib2.0-bin \
            dpkg-dev

      - name: Compile Python sources
        run: python3 -m compileall -q linux/src

      - name: Run unit tests
        env:
          PYTHONPATH: linux/src
        run: python3 -m unittest discover -s linux/tests -v

      - name: Validate desktop entry and AppStream metadata
        run: |
          desktop-file-validate linux/data/org.devnet.App.desktop
          appstreamcli validate --no-net linux/data/org.devnet.App.metainfo.xml

      - name: Check shell syntax
        run: |
          for script in \
            linux/install.sh linux/run.sh linux/bin/devnet \
            linux/package/deb/build.sh linux/package/deb/postinst \
            linux/package/deb/prerm linux/package/deb/postrm \
            linux/package/rpm/build.sh
          do
            sh -n "$script"
          done

      - name: Build .deb
        run: ./linux/package/deb/build.sh --output build/deb

      - name: Inspect .deb
        run: |
          package=$(find build/deb -name '*.deb' -print -quit)
          dpkg-deb --info "$package"
          dpkg-deb --contents "$package" >/dev/null
          dpkg-deb --contents "$package" | grep -q 'usr/libexec/devnet/devnet-helper'
          dpkg-deb --contents "$package" | grep -q 'usr/share/applications/org.devnet.App.desktop'
          dpkg-deb --contents "$package" | grep -q 'usr/lib/devnet/devnet/__main__.py'

      - name: Upload .deb
        uses: actions/upload-artifact@v4
        with:
          name: devnet-deb
          path: build/deb/*.deb
          if-no-files-found: error
          retention-days: 14

  rpm:
    name: RPM package
    runs-on: ubuntu-24.04
    container: fedora:latest
    steps:
      - name: Install git and RPM build tools
        run: dnf install -y git tar gzip rpm-build

      - uses: actions/checkout@v4

      - name: Build .rpm
        run: ./linux/package/rpm/build.sh --output build/rpm

      - name: Inspect .rpm
        run: |
          package=$(find build/rpm -name '*.rpm' -print -quit)
          rpm -qip "$package"
          rpm -qlp "$package"

      - name: Upload .rpm
        uses: actions/upload-artifact@v4
        with:
          name: devnet-rpm
          path: build/rpm/*.rpm
          if-no-files-found: error
          retention-days: 14
